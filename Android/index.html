<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<title>弹墨 · 深渊回响</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="900" height="660"></canvas>

    <div id="hud">
      <div class="hud-top">
        <div class="cell">
          <div class="k">深 度</div>
          <div class="v" id="hDepth">1</div>
          <div class="k gap">砚 台</div>
          <div class="inks" id="hInk"></div>
        </div>
        <div class="cell">
          <div class="k">余 珠</div>
          <div class="v" id="hBallNum">10</div>
          <div class="balls" id="hBalls"></div>
        </div>
        <div class="scoreBox">
          <div class="k">墨 迹</div>
          <div class="v big" id="hScore">0</div>
        </div>
      </div>

      <div class="hud-bottom">
        <div id="builds"></div>
        <div id="quota">
          <div class="qlabel">碎 墨 <span id="qPct">0 / 60</span></div>
          <div class="qbar"><i id="qFill"></i></div>
        </div>
        <div id="comboBox">
          <div class="cnum"><b id="cMult">×1.0</b><span id="cHits"></span></div>
          <div class="cbar"><i id="cFill"></i></div>
        </div>
      </div>

      <div class="hud-btns">
        <button id="btnHelp" title="玩法">?</button>
        <button id="btnSound" title="音 (M)">♪</button>
        <button id="btnPause" title="暂停 (P)">❙❙</button>
      </div>

      <div id="toast"></div>
    </div>

    <div id="panel" class="hidden"><div id="panelBox"></div></div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/content.js"></script>
<script src="js/physics.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
